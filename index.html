<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Matches & Differs Analyzer</title>

<style>

body{
    margin:0;
    padding:0;
    background:#000;
    color:#fff;
    font-family:Arial, sans-serif;
    text-align:center;
}

.container{
    margin-top:40px;
}

h1{
    color:#00ff99;
    font-size:42px;
}

#digit{
    font-size:150px;
    color:#00ff00;
    margin-top:20px;
    animation:pulse 0.5s infinite;
}

@keyframes pulse{
    0%{
        transform:scale(1);
    }

    50%{
        transform:scale(1.2);
    }

    100%{
        transform:scale(1);
    }
}

#signal{
    margin-top:20px;
    font-size:60px;
    font-weight:bold;
}

.match{
    color:#00ff00;
}

.differ{
    color:red;
}

#history{
    margin-top:20px;
    font-size:28px;
    padding:10px;
}

.stats{
    margin-top:30px;
    font-size:28px;
}

.status{
    margin-top:20px;
    color:yellow;
    font-size:20px;
}

.box{
    margin-top:20px;
}

</style>

</head>

<body>

<div class="container">

<h1>MATCHES & DIFFERS</h1>

<div id="digit">0</div>

<div id="signal">WAITING...</div>

<div id="history">History: </div>

<div class="stats">

<div class="box">
MATCHES:
<span id="matches">0</span>
</div>

<div class="box">
DIFFERS:
<span id="differs">0</span>
</div>

</div>

<div class="status" id="status">
Connecting...
</div>

</div>

<script>

const token = "pat_1b3858891a43710515ac152e7faf13140c5a18b76daf716a8dbf343c2548e2ba";

const socket = new WebSocket(
"wss://ws.derivws.com/websockets/v3?app_id=1089"
);

let previousDigit = null;

let history = [];

let matchCount = 0;

let differCount = 0;

socket.onopen = function(){

    document.getElementById("status").innerText =
    "Connected";

    socket.send(JSON.stringify({
        authorize: token
    }));

    socket.send(JSON.stringify({
        ticks: "R_100"
    }));
};

socket.onmessage = function(event){

    const data = JSON.parse(event.data);

    console.log(data);

    if(data.error){

        document.getElementById("status").innerText =
        "Token Error";

        console.log(data.error.message);
    }

    if(data.tick){

        let price = data.tick.quote.toString();

        let digit =
        price.charAt(price.length - 1);

        processDigit(digit);
    }
};

function processDigit(digit){

    document.getElementById("digit").innerText =
    digit;

    history.unshift(digit);

    if(history.length > 15){
        history.pop();
    }

    document.getElementById("history").innerText =
    "History: " + history.join(" ");

    if(previousDigit !== null){

        if(digit === previousDigit){

            matchCount++;

            document.getElementById("signal").innerText =
            "MATCH";

            document.getElementById("signal").className =
            "match";

        }else{

            differCount++;

            document.getElementById("signal").innerText =
            "DIFFER";

            document.getElementById("signal").className =
            "differ";
        }

        document.getElementById("matches").innerText =
        matchCount;

        document.getElementById("differs").innerText =
        differCount;
    }

    previousDigit = digit;
}

socket.onerror = function(error){

    document.getElementById("status").innerText =
    "Connection Error";

    console.log(error);
};

socket.onclose = function(){

    document.getElementById("status").innerText =
    "Disconnected";
};

</script>

</body>
</html>
